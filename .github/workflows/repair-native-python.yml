name: Repair native-helper Python source

on:
  pull_request:
    paths:
      - '.github/workflows/repair-native-python.yml'

permissions:
  contents: write

concurrency:
  group: mcp-smart-typer-native-python-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'workflow/verified-publication-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: workflow/verified-publication-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Decode the exact serialized source tail
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('packages/native-helpers/src/standalone_production_demo.py')
          text = path.read_text(encoding='utf-8')
          anchor = '                })\\n                \\n                self.logger.info(f\\"  Text'
          index = text.find(anchor)
          if index < 0:
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
              print('serialized source tail is already repaired')
          else:
              prefix_end = index + len('                })')
              escaped_tail = text[prefix_end:]
              decoded_tail = json.loads('"' + escaped_tail + '"')
              repaired = text[:prefix_end] + decoded_tail
              compile(repaired, str(path), 'exec')
              path.write_text(repaired, encoding='utf-8', newline='\n')
              print('decoded serialized source tail')
          PY
      - name: Format the shipped package and root test modules
        working-directory: packages/native-helpers
        run: |
          python -m pip install --disable-pip-version-check black==24.10.0 isort==5.13.2
          python -m black src test_*.py
          python -m isort src test_*.py
      - name: Compile every shipped Python module
        working-directory: packages/native-helpers
        run: |
          python - <<'PY'
          import compileall
          import sys
          if not compileall.compile_dir('src', quiet=1):
              raise SystemExit('src compilation failed')
          PY
      - name: Restrict the repair to native-helper Python files
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              packages/native-helpers/*.py|packages/native-helpers/src/*.py|packages/native-helpers/src/*/*.py) ;;
              *) echo "unexpected repair output: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit the verified source repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/native-helpers/src packages/native-helpers/test_*.py
          git commit -m 'fix: repair and format native-helper Python sources'
          git push origin HEAD:workflow/verified-publication-v1
