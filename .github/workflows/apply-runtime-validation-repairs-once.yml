name: Apply runtime validation repairs once

on:
  pull_request:
    paths:
      - '.github/workflows/apply-runtime-validation-repairs-once.yml'

permissions:
  contents: write

concurrency:
  group: mcp-smart-typer-runtime-validation-repair-once
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'workflow/verified-publication-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: workflow/verified-publication-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Repair optional TensorFlow annotations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/native-helpers/src/vision_classifier.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'def __init__(self, model_cache_dir: str = None):':
                  'def __init__(self, model_cache_dir: Optional[str] = None):',
              'def _load_cached_model(self) -> Optional[tf.keras.Model]:':
                  'def _load_cached_model(self) -> Optional[Any]:',
          }
          for old, new in replacements.items():
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'ambiguous annotation anchor: {old}')
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'missing annotation anchor: {old}')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Normalize each parsable Python runtime and test file
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==24.10.0 isort==5.13.2
          cd packages/native-helpers
          mapfile -d '' files < <(
            find src tests -type f -name '*.py' -not -path 'src/generated/*' -print0
            find . -maxdepth 1 -type f -name 'test_*.py' -print0
          )
          for file in "${files[@]}"; do
            python -m py_compile "$file"
            python -m black "$file"
            python -m isort "$file"
          done
          python -m compileall -q src tests

      - name: Synchronize the npm lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.3
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify repaired policy and lint configuration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-boundary.js
          npx eslint 'packages/mcp-server-smart-typer/src/**/*.ts' --fix-dry-run
          git diff --check

      - name: Remove the one-shot workflow and publish one repair commit
        shell: bash
        env:
          TARGET_BRANCH: workflow/verified-publication-v1
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-runtime-validation-repairs-once.yml
          git add -A
          git diff --cached --quiet && {
            echo 'repair transaction produced no source diff' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair runtime validation boundaries'
          git push origin "HEAD:${TARGET_BRANCH}"
