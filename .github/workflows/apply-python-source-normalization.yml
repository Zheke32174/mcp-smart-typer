name: Apply Python source normalization

on:
  pull_request:
    paths:
      - '.github/workflows/apply-python-source-normalization.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'workflow/verified-publication-v1'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Restore the encoded demo tail and require valid syntax
        shell: pwsh
        run: |
          @'
          import ast
          import json
          from pathlib import Path

          path = Path('packages/native-helpers/src/standalone_production_demo.py')
          text = path.read_text(encoding='utf-8')
          marker = '                })\\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one encoded-tail marker, found {text.count(marker)}')
          index = text.index(marker) + len('                })')
          encoded_tail = text[index:]
          try:
              decoded_tail = json.loads('"' + encoded_tail + '"')
          except json.JSONDecodeError as exc:
              raise SystemExit(f'encoded demo tail is not one JSON string fragment: {exc}') from exc
          repaired = text[:index] + decoded_tail
          ast.parse(repaired, filename=str(path))
          path.write_text(repaired, encoding='utf-8', newline='\n')
          print(f'restored {len(encoded_tail)} encoded characters into {decoded_tail.count(chr(10))} source lines')
          '@ | python -
      - name: Format owned Python sources
        run: |
          python -m pip install black isort
          python -m black packages/native-helpers --exclude '/src/generated/'
          python -m isort packages/native-helpers --skip-glob '*/src/generated/*'
      - name: Compile normalized Python sources
        run: >-
          python -m compileall -q
          -x '[/\\]src[/\\]generated[/\\]'
          packages/native-helpers
      - name: Commit only owned Python source normalization
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              packages/native-helpers/*.py|packages/native-helpers/**/*.py) ;;
              *) echo "unexpected normalized path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/native-helpers
          git commit -m 'Normalize owned Python source'
          git push origin "HEAD:${HEAD_BRANCH}"
