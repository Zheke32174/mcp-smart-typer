name: Native helper diagnostics

on:
  pull_request:
    paths:
      - 'packages/native-helpers/**'
      - '.github/workflows/python-diagnostics.yml'
  push:
    branches: [main]
    paths:
      - 'packages/native-helpers/**'
      - '.github/workflows/python-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: mcp-smart-typer-python-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: windows-2022
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/native-helpers
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/native-helpers/pyproject.toml
      - name: Install owned package and diagnostic tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install black==24.10.0 isort==5.13.2 mypy pytest
      - name: Prepare and generate protobuf package
        run: |
          python -c "from pathlib import Path; p=Path('src/generated'); p.mkdir(parents=True, exist_ok=True); (p/'__init__.py').touch()"
          python -m grpc_tools.protoc -I ./proto --python_out=./src/generated --grpc_python_out=./src/generated ./proto/ui_automation.proto
      - name: Compile native helper source
        run: python -m compileall -q src tests
      - id: format
        name: Capture formatter diagnostics
        shell: pwsh
        run: |
          python -m black --check --exclude "src[\\/]generated" src tests *> black.log
          $status = $LASTEXITCODE
          "exit_code=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content -LiteralPath black.log
          exit 0
      - id: typecheck
        name: Capture type diagnostics
        shell: pwsh
        run: |
          python -m mypy src/ --exclude "src[\\/]generated" --ignore-missing-imports *> mypy.log
          $status = $LASTEXITCODE
          "exit_code=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content -LiteralPath mypy.log
          exit 0
      - id: tests
        name: Capture focused native tests
        shell: pwsh
        run: |
          python -m pytest -xvs tests *> pytest.log
          $status = $LASTEXITCODE
          "exit_code=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content -LiteralPath pytest.log
          exit 0
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-python-diagnostics-${{ github.sha }}
          path: |
            packages/native-helpers/black.log
            packages/native-helpers/mypy.log
            packages/native-helpers/pytest.log
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize experimental native status
        if: always()
        shell: pwsh
        run: |
          "Native helper remains experimental and is not part of the npm tarball." | Write-Output
          "black=${{ steps.format.outputs.exit_code }} mypy=${{ steps.typecheck.outputs.exit_code }} pytest=${{ steps.tests.outputs.exit_code }}" | Write-Output
