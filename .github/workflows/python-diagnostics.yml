name: Python diagnostics

on:
  pull_request:
    paths:
      - 'packages/native-helpers/**'
      - '.github/workflows/python-diagnostics.yml'
  push:
    branches: [main]
    paths:
      - 'packages/native-helpers/**'
      - '.github/workflows/python-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: mcp-smart-typer-python-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: packages/native-helpers
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/native-helpers/pyproject.toml
      - name: Install owned package and diagnostic tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install black isort mypy pytest
      - name: Prepare generated Python package
        run: >-
          python -c "from pathlib import Path; p=Path('src/generated'); p.mkdir(parents=True, exist_ok=True); (p/'__init__.py').touch()"
      - name: Generate protobuf files
        run: >-
          python -m grpc_tools.protoc
          -I ./proto
          --python_out=./src/generated
          --grpc_python_out=./src/generated
          ./proto/ui_automation.proto
      - id: format
        name: Capture exact formatting patch
        shell: pwsh
        run: |
          python -m black .
          python -m isort .
          git -C ../.. diff -- packages/native-helpers | Out-File -LiteralPath formatting.patch -Encoding utf8
          if ((Get-Item -LiteralPath formatting.patch).Length -gt 0) {
            'exit_code=1' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Get-Content -LiteralPath formatting.patch
          } else {
            'exit_code=0' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            'workspace is formatter-clean' | Set-Content -LiteralPath formatting.patch
          }
      - id: typecheck
        name: Capture complete type report
        shell: pwsh
        run: |
          python -m mypy src/ --ignore-missing-imports *> mypy.log
          $status = $LASTEXITCODE
          "exit_code=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content -LiteralPath mypy.log
          exit 0
      - id: tests
        name: Capture complete test report
        shell: pwsh
        run: |
          python -m pytest -xvs . *> pytest.log
          $status = $LASTEXITCODE
          "exit_code=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content -LiteralPath pytest.log
          exit 0
      - name: Upload Python diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-diagnostics-${{ github.sha }}
          path: |
            packages/native-helpers/formatting.patch
            packages/native-helpers/mypy.log
            packages/native-helpers/pytest.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce diagnostic result
        if: always()
        shell: pwsh
        env:
          FORMAT_EXIT: ${{ steps.format.outputs.exit_code }}
          MYPY_EXIT: ${{ steps.typecheck.outputs.exit_code }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
        run: |
          if ($env:FORMAT_EXIT -ne '0') { throw 'Python formatting changes are required' }
          if ($env:MYPY_EXIT -ne '0') { throw 'Python type checking failed' }
          if ($env:TEST_EXIT -ne '0') { throw 'Python tests failed or no tests were collected' }
