name: Repair Python boundary once

on:
  push:
    branches: [workflow/verified-publication-v1]
    paths:
      - '.github/workflows/repair-python-boundary-once.yml'

permissions:
  contents: write

concurrency:
  group: mcp-smart-typer-python-boundary-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: workflow/verified-publication-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Remove illegal control bytes from owned Python source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          for path in sorted(Path('packages/native-helpers').rglob('*.py')):
              if 'generated' in path.parts:
                  continue
              payload = path.read_bytes()
              repaired = payload.replace(b'\x1e', b'>')
              if repaired != payload:
                  repaired.decode('utf-8')
                  compile(repaired, str(path), 'exec')
                  path.write_bytes(repaired)
                  changed.append(str(path))
          print('repaired control-byte files:', changed)
          PY
      - name: Make TensorFlow an explicit optional accelerator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/native-helpers/src/vision_classifier.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'import tensorflow as tf\n'
          new_import = '''try:\n    import tensorflow as tf\nexcept ImportError:  # Optional accelerator; rule-based fallback remains available.\n    tf = None\n'''
          if text.count(old_import) != 1:
              raise SystemExit('unexpected TensorFlow import shape')
          text = text.replace(old_import, new_import, 1)
          text = text.replace(' -> tf.keras.Model:', ' -> Any:')
          text = text.replace('model: tf.keras.Model', 'model: Any')
          anchor = '''        if self.is_loaded:\n            return\n\n        try:\n'''
          replacement = '''        if self.is_loaded:\n            return\n\n        if tf is None:\n            logger.info("TensorFlow unavailable; using rule-based field classification")\n            self.model = None\n            self.is_loaded = False\n            return\n\n        try:\n'''
          if text.count(anchor) != 1:
              raise SystemExit('unexpected initialize_model shape')
          text = text.replace(anchor, replacement, 1)
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Normalize repaired Python source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==24.10.0 isort==5.13.2
          cd packages/native-helpers
          python -m black --extend-exclude 'src/generated' src tests test_*.py
          python -m isort --skip src/generated src tests test_*.py
          python -m compileall -q src tests
      - name: Remove workflow and publish exact repair
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-python-boundary-once.yml
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'repair produced no change' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair optional Python vision boundary'
          git push origin HEAD:workflow/verified-publication-v1
