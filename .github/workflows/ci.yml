name: Verify source and build candidates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: mcp-smart-typer-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '8.15.0'

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate repository-owned release policy
        run: node scripts/validate-cicd.js

  test-node:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Upload TypeScript candidate
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: typescript-candidate-${{ github.sha }}
          path: |
            packages/mcp-server-smart-typer/dist/
            packages/mcp-server-smart-typer/package.json
            packages/mcp-server-smart-typer/README.md
            packages/mcp-server-smart-typer/LICENSE
          if-no-files-found: error
          retention-days: 14

  test-python:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: packages/native-helpers
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/native-helpers/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install black isort mypy pytest
      - name: Generate protobuf files
        run: >-
          python -m grpc_tools.protoc
          -I ./proto
          --python_out=./src/generated
          --grpc_python_out=./src/generated
          ./proto/ui_automation.proto
      - name: Format check
        run: python -m black --check .
      - name: Import order check
        run: python -m isort --check-only .
      - name: Type check
        run: python -m mypy src/ --ignore-missing-imports
      - name: Run Python tests
        run: python -m pytest -xvs .

  build-python-candidate:
    runs-on: windows-2022
    needs: test-python
    defaults:
      run:
        working-directory: packages/native-helpers
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/native-helpers/requirements.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Generate protobuf files
        run: >-
          python -m grpc_tools.protoc
          -I ./proto
          --python_out=./src/generated
          --grpc_python_out=./src/generated
          ./proto/ui_automation.proto
      - name: Build executable candidate
        run: python -m PyInstaller build_uia_server.spec --clean --noconfirm
      - name: Verify executable candidate
        shell: pwsh
        run: |
          $path = 'dist/mcp-uia-server.exe'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw 'candidate executable was not produced'
          }
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw 'invalid executable digest' }
          "sha256:$hash  mcp-uia-server.exe" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload Python executable candidate
        uses: actions/upload-artifact@v4
        with:
          name: python-executable-candidate-${{ github.sha }}
          path: |
            packages/native-helpers/dist/mcp-uia-server.exe
            packages/native-helpers/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
