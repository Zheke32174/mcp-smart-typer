name: Verify bounded npm source and candidates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: mcp-smart-typer-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  NPM_VERSION: '10.9.3'

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: policy
        name: Capture repository-owned release policy
        shell: bash
        run: |
          set +e
          node scripts/validate-release-boundary.js > release-policy.log 2>&1
          status=$?
          cat release-policy.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload release-policy receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-policy-${{ github.sha }}
          path: release-policy.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce repository-owned release policy
        shell: bash
        env:
          POLICY_EXIT: ${{ steps.policy.outputs.exit_code }}
        run: test "$POLICY_EXIT" = '0'

  test-node-release:
    name: test mock package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint distributable source
        run: npm run lint:release --workspace @mcp-smart-typer/server
      - name: Type check distributable source
        run: npm run typecheck:release --workspace @mcp-smart-typer/server
      - name: Build distributable source
        run: npm run build:release --workspace @mcp-smart-typer/server
      - name: Verify mock-only release contract
        run: npm run test:release --workspace @mcp-smart-typer/server
      - name: Inspect npm tarball boundary
        shell: bash
        run: |
          set -euo pipefail
          cd packages/mcp-server-smart-typer
          npm pack --dry-run --json > npm-pack.json
          python3 - <<'PY'
          import json
          import pathlib

          report = json.loads(pathlib.Path('npm-pack.json').read_text(encoding='utf-8'))
          assert isinstance(report, list) and len(report) == 1
          files = {entry['path'] for entry in report[0]['files']}
          required = {'package.json', 'README.md', 'LICENSE', 'dist/index.js'}
          missing = required - files
          assert not missing, f'missing release files: {sorted(missing)}'
          forbidden_prefixes = ('src/', 'test/', 'scripts/', 'node_modules/')
          forbidden = sorted(path for path in files if path.startswith(forbidden_prefixes))
          assert not forbidden, f'private source escaped npm boundary: {forbidden}'
          PY
      - name: Upload Node diagnostics and candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mock-package-${{ matrix.node-version }}-${{ github.sha }}
          path: |
            packages/mcp-server-smart-typer/dist/
            packages/mcp-server-smart-typer/npm-pack.json
            packages/mcp-server-smart-typer/package.json
            packages/mcp-server-smart-typer/README.md
            packages/mcp-server-smart-typer/LICENSE
          if-no-files-found: error
          retention-days: 14
