name: Verify source and build candidates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: mcp-smart-typer-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  PYTHON_VERSION: '3.11'
  NPM_VERSION: '10.9.3'

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate repository-owned release policy
        run: node scripts/validate-release-boundary.js

  test-node:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture lint diagnostics
        shell: pwsh
        run: |
          npm run lint *>&1 | Tee-Object -FilePath node-lint.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Upload Node diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-diagnostics-${{ matrix.node-version }}-${{ github.sha }}
          path: node-lint.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload TypeScript candidate
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typescript-candidate-${{ github.sha }}
          path: |
            packages/mcp-server-smart-typer/dist/
            packages/mcp-server-smart-typer/package.json
            packages/mcp-server-smart-typer/README.md
            packages/mcp-server-smart-typer/LICENSE
          if-no-files-found: error
          retention-days: 14

  test-python:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: packages/native-helpers
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/native-helpers/pyproject.toml
      - name: Install owned package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install black==24.10.0 isort==5.13.2 mypy pytest
      - name: Prepare generated Python package
        run: >-
          python -c "from pathlib import Path; p=Path('src/generated'); p.mkdir(parents=True, exist_ok=True); (p/'__init__.py').touch()"
      - name: Generate protobuf files
        run: >-
          python -m grpc_tools.protoc
          -I ./proto
          --python_out=./src/generated
          --grpc_python_out=./src/generated
          ./proto/ui_automation.proto
      - name: Compile owned Python source
        run: python -m compileall -q src tests
      - name: Format check
        run: python -m black --check --extend-exclude "src/generated" src tests test_*.py
      - name: Import order check
        run: python -m isort --check-only --skip src/generated src tests test_*.py
      - name: Type check
        run: python -m mypy src/ --exclude "src[\\/]generated" --ignore-missing-imports
      - name: Run Python tests
        run: python -m pytest -xvs .

  build-python-candidate:
    runs-on: windows-2022
    needs: test-python
    defaults:
      run:
        working-directory: packages/native-helpers
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/native-helpers/pyproject.toml
      - name: Install owned package build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Prepare generated Python package
        run: >-
          python -c "from pathlib import Path; p=Path('src/generated'); p.mkdir(parents=True, exist_ok=True); (p/'__init__.py').touch()"
      - name: Generate protobuf files
        run: >-
          python -m grpc_tools.protoc
          -I ./proto
          --python_out=./src/generated
          --grpc_python_out=./src/generated
          ./proto/ui_automation.proto
      - name: Build executable candidate
        run: python -m PyInstaller build_uia_server.spec --clean --noconfirm
      - name: Verify executable candidate
        shell: pwsh
        run: |
          $path = 'dist/mcp-uia-server.exe'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw 'candidate executable was not produced'
          }
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw 'invalid executable digest' }
          "sha256:$hash  mcp-uia-server.exe" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload Python executable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-executable-candidate-${{ github.sha }}
          path: |
            packages/native-helpers/dist/mcp-uia-server.exe
            packages/native-helpers/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
