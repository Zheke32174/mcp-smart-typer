name: CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '8.15.0'

jobs:
  test-node:
    runs-on: windows-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install pnpm
      run: npm install -g pnpm@${{ env.PNPM_VERSION }}
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Lint
      run: pnpm lint
    
    - name: Type check
      run: pnpm typecheck
    
    - name: Build
      run: pnpm build
    
    - name: Test
      run: pnpm test
    
    # Upload build artifacts for publishing job
    - name: Upload TypeScript build artifacts
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: typescript-build
        path: |
          packages/mcp-server-smart-typer/dist/
          packages/mcp-server-smart-typer/package.json
          packages/mcp-server-smart-typer/README.md
          packages/mcp-server-smart-typer/LICENSE

  test-python:
    runs-on: windows-latest
    
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      working-directory: ./packages/native-helpers
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black isort mypy pytest
    
    - name: Generate protobuf files
      working-directory: ./packages/native-helpers
      run: |
        python -m grpc_tools.protoc -I ./proto --python_out=./src/generated --grpc_python_out=./src/generated ./proto/ui_automation.proto
    
    - name: Format check with black
      working-directory: ./packages/native-helpers
      run: black --check .
    
    - name: Import sort check
      working-directory: ./packages/native-helpers  
      run: isort --check-only .
    
    - name: Type check with mypy
      working-directory: ./packages/native-helpers
      run: mypy src/ --ignore-missing-imports
    
    - name: Run Python tests
      working-directory: ./packages/native-helpers
      run: |
        python -m pytest -xvs . || echo "No tests found, continuing..."

  build-python-executable:
    runs-on: windows-latest
    needs: test-python
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install build dependencies
      working-directory: ./packages/native-helpers
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Generate protobuf files
      working-directory: ./packages/native-helpers
      run: |
        python -m grpc_tools.protoc -I ./proto --python_out=./src/generated --grpc_python_out=./src/generated ./proto/ui_automation.proto
    
    - name: Build Python executable
      working-directory: ./packages/native-helpers
      run: |
        pyinstaller build_uia_server.spec --clean --noconfirm
    
    - name: Test executable
      working-directory: ./packages/native-helpers
      run: |
        if (Test-Path "dist\mcp-uia-server.exe") {
          Write-Host "✅ Executable built successfully"
          Get-Item "dist\mcp-uia-server.exe" | Select-Object Name, Length, LastWriteTime
        } else {
          Write-Error "❌ Executable not found"
          exit 1
        }
    
    - name: Upload Python executable
      uses: actions/upload-artifact@v4
      with:
        name: python-executable
        path: packages/native-helpers/dist/mcp-uia-server.exe

  publish-npm:
    runs-on: windows-latest
    needs: [test-node, build-python-executable]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install pnpm
      run: npm install -g pnpm@${{ env.PNPM_VERSION }}
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: typescript-build
        path: packages/mcp-server-smart-typer/
    
    - name: Download Python executable
      uses: actions/download-artifact@v4
      with:
        name: python-executable
        path: packages/mcp-server-smart-typer/bin/
    
    - name: Update package.json for publishing
      working-directory: ./packages/mcp-server-smart-typer
      shell: pwsh
      run: |
        $packageJson = Get-Content package.json | ConvertFrom-Json
        $packageJson.name = "@modelcontextprotocol/server-smart-typer"
        
        # Add bin entry for the Python executable
        if (-not $packageJson.bin) {
          $packageJson.bin = @{}
        }
        $packageJson.bin."mcp-uia-server" = "bin/mcp-uia-server.exe"
        
        # Add files array to include the binary
        $packageJson.files = @(
          "dist/**/*",
          "bin/**/*",
          "README.md",
          "LICENSE"
        )
        
        # Update repository URL
        $packageJson.repository.url = "https://github.com/modelcontextprotocol/server-smart-typer.git"
        
        $packageJson | ConvertTo-Json -Depth 10 | Set-Content package.json
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Build package
      working-directory: ./packages/mcp-server-smart-typer
      run: pnpm build
    
    - name: Publish to npm (main branch - beta)
      if: github.ref == 'refs/heads/main'
      working-directory: ./packages/mcp-server-smart-typer
      run: |
        $version = node -p "require('./package.json').version"
        $betaVersion = "$version-beta.$(Get-Date -Format 'yyyyMMddHHmmss')"
        npm version $betaVersion --no-git-tag-version
        npm publish --tag beta
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    
    - name: Publish to npm (tagged release)
      if: startsWith(github.ref, 'refs/tags/v')
      working-directory: ./packages/mcp-server-smart-typer
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    runs-on: windows-latest
    needs: [publish-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download Python executable
      uses: actions/download-artifact@v4
      with:
        name: python-executable
        path: ./release-assets/
    
    - name: Generate release notes
      id: release-notes
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        $previousTag = git describe --tags --abbrev=0 $version^ 2>$null
        
        if ($previousTag) {
          $commits = git log --pretty=format:"- %s" $previousTag..$version
        } else {
          $commits = git log --pretty=format:"- %s" $version
        }
        
        $releaseNotes = @"
        ## MCP Smart Typer $version
        
        ### Features
        - Windows UI Automation via gRPC
        - Smart field detection and typing
        - OCR-based form field analysis
        - MCP (Model Context Protocol) compatible server
        
        ### Changes in this release
        $commits
        
        ### Installation
        
        #### Via npm:
        ```bash
        npm install -g @modelcontextprotocol/server-smart-typer
        ```
        
        #### Standalone executable:
        Download `mcp-uia-server.exe` from the assets below.
        
        ### MCP Specification Compliance
        This server implements MCP specification version 1.0 and provides:
        - Resource discovery and management
        - Tool execution with proper error handling
        - Secure UI automation with permission controls
        - Structured logging and audit trails
        
        ### System Requirements
        - Windows 10/11
        - Node.js 18+ (for npm package)
        - .NET Framework 4.7.2+ (for executable)
        "@
        
        # Save to file and environment
        $releaseNotes | Out-File -Encoding utf8 "release-notes.md"
        "RELEASE_NOTES=$releaseNotes" | Out-File -Append $env:GITHUB_ENV
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: MCP Smart Typer ${{ github.ref_name }}
        body_path: release-notes.md
        files: |
          release-assets/mcp-uia-server.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
