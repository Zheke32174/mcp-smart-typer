name: Apply mock package release boundary once

on:
  push:
    branches: [workflow/verified-publication-v1]
    paths:
      - '.github/workflows/apply-release-boundary-once.yml'

permissions:
  contents: write

concurrency:
  group: mcp-smart-typer-release-boundary-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: workflow/verified-publication-v1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
      - name: Remove imports excluded from the public mock contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/mcp-server-smart-typer/src/simple-server.ts')
          text = path.read_text(encoding='utf-8')
          for unused in (
              '  detectFieldsResponse,\n',
              '  typeTextResponse,\n',
              '  getFieldValueResponse,\n',
              '  focusFieldResponse,\n',
          ):
              text = text.replace(unused, '')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Refresh the lock from the bounded manifest
        run: |
          set -euo pipefail
          npm install --global npm@10.9.3
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Normalize and validate the public package
        run: |
          set -euo pipefail
          npm run format --workspace @mcp-smart-typer/server
          npm run lint:release --workspace @mcp-smart-typer/server
          npm run typecheck:release --workspace @mcp-smart-typer/server
          npm run build:release --workspace @mcp-smart-typer/server
          npm run test:release --workspace @mcp-smart-typer/server
          git diff --check
      - name: Remove this workflow and publish one repair commit
        env:
          TARGET_BRANCH: workflow/verified-publication-v1
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-release-boundary-once.yml
          git add -A
          git diff --cached --quiet && {
            echo 'expected a release-boundary repair diff' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Enforce the mock-only npm release boundary'
          git push origin "HEAD:${TARGET_BRANCH}"
