name: Repair and normalize source once

on:
  pull_request:
    paths:
      - '.github/workflows/apply-python-formatting-once.yml'

permissions:
  contents: write

concurrency:
  group: mcp-smart-typer-source-normalization-once
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'workflow/verified-publication-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: workflow/verified-publication-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.x'
      - name: Decode serialized Python source tail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('packages/native-helpers/src/standalone_production_demo.py')
          text = path.read_text(encoding='utf-8')
          index = text.find('\\n', 10000)
          if index >= 0:
              decoded_tail = json.loads('"' + text[index:].strip())
              text = text[:index] + decoded_tail
              compile(text, str(path), 'exec')
              path.write_text(text, encoding='utf-8', newline='\n')
          else:
              compile(text, str(path), 'exec')
          PY
      - name: Normalize Python formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==24.10.0 isort==5.13.2
          (
            cd packages/native-helpers
            python -m black src test_*.py
            python -m isort src test_*.py
          )
      - name: Install locked Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.8.2
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Normalize TypeScript formatting and safe autofixes
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write "packages/mcp-server-smart-typer/src/**/*.ts"
          (
            cd packages/mcp-server-smart-typer
            npx eslint "src/**/*.ts" --fix || true
          )
      - name: Align mock server version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/mcp-server-smart-typer/src/simple-server.ts')
          text = path.read_text(encoding='utf-8')
          old = "const SERVER_VERSION = '1.0.0';"
          if text.count(old) != 1:
              raise SystemExit('expected exactly one mock-server version constant')
          path.write_text(text.replace(old, "const SERVER_VERSION = '2.0.0';"), encoding='utf-8')
          PY
      - name: Verify normalized source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q packages/native-helpers/src
          git diff --check
      - name: Remove the one-shot workflow and publish one normalization commit
        shell: bash
        env:
          TARGET_BRANCH: workflow/verified-publication-v1
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-python-formatting-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No normalization changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair and normalize owned source'
          git push origin "HEAD:${TARGET_BRANCH}"
